name: Suggest an improvement
description: Describe a conversion task you would like Formatide to support.
title: "[Idea] "
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the task and where the current workflow falls short.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: Optional. Do not include confidential files or personal information.
